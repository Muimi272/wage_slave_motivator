name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unpublished version tag
        required: true
        default: v1.1.2

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify version
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Prepare draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if existing=$(gh release view "$RELEASE_TAG" --json databaseId,isDraft 2>/dev/null); then
            test "$(echo "$existing" | jq -r '.isDraft')" = true
            release_id=$(echo "$existing" | jq -r '.databaseId')
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Wage Slave Motivator $RELEASE_TAG" --notes-file RELEASE.md
            release_id=$(gh release view "$RELEASE_TAG" --json databaseId --jq '.databaseId')
          fi
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            targets: ''
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg,app
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: --bundles deb,appimage
            targets: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
      - name: Validate Linux packages
        if: runner.os == 'Linux'
        run: |
          for package in target/release/bundle/deb/*.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --field "$package" Package | grep -Eq '^[a-z0-9][a-z0-9+.-]+$'
          done
          file target/release/bundle/appimage/*.AppImage
      - name: Verify universal macOS executable
        if: runner.os == 'macOS'
        run: lipo target/universal-apple-darwin/release/wage_slave_motivator -verify_arch arm64 x86_64
      - name: Upload verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/upload-bundles.mjs?ref=$GITHUB_SHA" --jq .content | base64 --decode > upload-bundles.mjs
          node upload-bundles.mjs

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify packages and upload checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --dir artifacts/release
          node scripts/release-checksums.mjs
          gh release upload "$RELEASE_TAG" artifacts/release/SHA256SUMS.txt --clobber
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
